
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOLAR 3D EXPLORER</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#020510;color:white;font-family:Arial;overflow:hidden}
#scene{position:fixed;inset:0}
header{position:absolute;top:15px;left:15px;pointer-events:none}
header p{margin:4px 0 0;font-size:14px;opacity:.85}
h1{font-size:21px;color:#75d9ff;margin:0}
.panel{position:absolute;bottom:12px;left:10px;right:10px;background:#101c30ee;padding:12px;border-radius:15px}
#planets{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px}
button{background:#1b3552;color:white;border:1px solid #426484;border-radius:20px;padding:10px;white-space:nowrap}
.info{font-size:13px;min-height:30px}
</style>
</head>
<body>
<div id="scene"></div>
<header><h1>☀ SOLAR 3D EXPLORER</h1><p>Explore o Sistema Solar</p></header>
<div class="panel">
<div id="planets"></div>
<div class="info" id="info">Escolha um planeta!</div>
<button id="pause">⏸ Pausar</button>
<button id="zoom">🔍 Aproximar</button>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x020510);

const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,1000);

// Distância que faz o sistema inteiro caber na largura da tela
function overviewDistance(){
const half=THREE.MathUtils.degToRad(camera.fov/2);
const hHalf=Math.atan(Math.tan(half)*camera.aspect);
return 38/Math.tan(Math.min(half,hHalf))*0.85;
}
let zoomLevel=1;          // 1 = tudo visível, menor = mais perto
let focus=null;           // planeta selecionado (ou null = visão geral)
const lookTarget=new THREE.Vector3();
const camGoal=new THREE.Vector3();
function overviewPosition(out){
const d=overviewDistance()*zoomLevel;
return out.set(0,d*.55,d*.84);
}
overviewPosition(camera.position);
camera.lookAt(0,0,0);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.getElementById('scene').appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff,1));
const light=new THREE.PointLight(0xffffff,3,300);
scene.add(light);

const sun=new THREE.Mesh(
new THREE.SphereGeometry(3,48,48),
new THREE.MeshBasicMaterial({color:0xffaa22})
);
scene.add(sun);

const data=[
['Mercúrio',.55,5,0xb5aaa0,'O menor planeta.'],
['Vênus',.9,7,0xe8bd78,'Um planeta muito quente.'],
['Terra',1,10,0x258bff,'Nosso planeta azul.'],
['Marte',.75,13,0xd95735,'O planeta vermelho.'],
['Júpiter',2.1,18,0xd6a77c,'O maior planeta.'],
['Saturno',1.8,24,0xe8d39b,'O planeta dos anéis.'],
['Urano',1.35,29,0x75d9dc,'Um gigante gelado.'],
['Netuno',1.3,34,0x3159db,'Um planeta azul distante.']
];

const planets=[];
data.forEach((p,i)=>{
const group=new THREE.Group();
scene.add(group);

const mesh=new THREE.Mesh(
new THREE.SphereGeometry(p[1],32,32),
new THREE.MeshStandardMaterial({color:p[3]})
);
mesh.position.x=p[2];
group.add(mesh);

if(p[0]==='Saturno'){
const ring=new THREE.Mesh(
new THREE.RingGeometry(2.2,3.1,64),
new THREE.MeshBasicMaterial({color:0xcdbb92,side:THREE.DoubleSide})
);
ring.rotation.x=-Math.PI/2.5;
mesh.add(ring);
}

const orbit=new THREE.Mesh(
new THREE.RingGeometry(p[2]-.025,p[2]+.025,128),
new THREE.MeshBasicMaterial({color:0x52657c,side:THREE.DoubleSide})
);
orbit.rotation.x=-Math.PI/2;
scene.add(orbit);

planets.push({group,mesh,angle:i*.8,distance:p[2],size:p[1],name:p[0]});
});

const starGeometry=new THREE.BufferGeometry();
const starPositions=[];
for(let i=0;i<1800;i++){
starPositions.push((Math.random()-.5)*400,(Math.random()-.5)*250,(Math.random()-.5)*400);
}
starGeometry.setAttribute('position',new THREE.Float32BufferAttribute(starPositions,3));
scene.add(new THREE.Points(starGeometry,new THREE.PointsMaterial({color:0xffffff,size:.5})));

data.forEach((p,i)=>{
const b=document.createElement('button');
b.textContent=p[0];
b.onclick=()=>{
document.getElementById('info').textContent=p[0]+': '+p[4];
focus=planets[i];
zoomBtn.textContent='🌞 Ver todos';
};
document.getElementById('planets').appendChild(b);
});

let running=true;
document.getElementById('pause').onclick=()=>{
running=!running;
document.getElementById('pause').textContent=running?'⏸ Pausar':'▶ Continuar';
};

const zoomBtn=document.getElementById('zoom');
zoomBtn.onclick=()=>{
if(focus){
focus=null;
document.getElementById('info').textContent='Escolha um planeta!';
}else{
zoomLevel=zoomLevel>.4?zoomLevel*.7:1;
}
zoomBtn.textContent=zoomLevel>.4?'🔍 Aproximar':'🔭 Afastar';
};

function animate(){
requestAnimationFrame(animate);
if(running){
planets.forEach((p,i)=>{
p.angle+=.002*(36/p.distance);
p.group.rotation.y=p.angle;
p.mesh.rotation.y+=.01;
});
}
const wanted=new THREE.Vector3();
if(focus){
focus.mesh.getWorldPosition(wanted);
const d=focus.size*6+4;
camGoal.set(wanted.x*1.0+d*.4,d*.6,wanted.z+d);
}else{
wanted.set(0,0,0);
overviewPosition(camGoal);
}
camera.position.lerp(camGoal,.06);
lookTarget.lerp(wanted,.12);
camera.lookAt(lookTarget);
renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
